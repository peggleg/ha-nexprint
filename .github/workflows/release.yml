name: Release Integration

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Zip Archive
        run: |
          # Create a folder named nexprint and copy repository contents into it
          mkdir nexprint
          
          # Move everything (except the nexprint folder itself, git metadata, and workflows) into the nexprint folder
          find . -maxdepth 1 ! -name '.' ! -name 'nexprint' ! -name '.git' ! -name '.github' -exec mv {} nexprint/ \;
          
          # Zip the nexprint folder so the archive contains nexprint/manifest.json
          zip -r nexprint.zip nexprint

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexprint.zip
