name: Release Integration

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Zip Archive
        run: |
          # Create a temporary staging directory
          mkdir -p staging/nexprint
          
          # Copy your integration files into the staging nexprint folder, 
          # excluding git files, workflows, and build artifacts
          rsync -av --exclude='staging' --exclude='.git' --exclude='.github' --exclude='nexprint.zip' ./ staging/nexprint/
          
          # Create the zip archive from inside the staging directory so it has the correct root folder structure
          cd staging
          zip -r ../nexprint.zip nexprint
          cd ..
          
          # Clean up staging
          rm -rf staging

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexprint.zip
