name: Release Integration

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Zip Archive
        run: |
          # Zip the nexprint folder directly from the repository root
          zip -r nexprint.zip nexprint

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexprint.zip