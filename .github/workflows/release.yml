name: Release Integration

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Zip Archive
        run: |
          # Create a dedicated nexprint directory and move files into it
          mkdir nexprint
          find . -maxdepth 1 ! -name '.' ! -name 'nexprint' ! -name '.git' ! -name '.github' -exec mv {} nexprint/ \;
          
          # Create the zip archive from the parent directory so nexprint/ is the root
          zip -r nexprint.zip nexprint

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexprint.zip
