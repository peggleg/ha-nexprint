name: Release Integration

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Zip Archive
        run: |
          # Create a staging directory and copy the integration files into it
          mkdir -p nexprint
          
          # Copy all relevant integration files into the staging folder
          # (adjust or exclude non-integration files like .git, .github, workflows, etc.)
          cp manifest.json __init__.py api.py sensor.py coordinator.py config_flow.py const.py services.yaml nexprint/
          cp -r translations nexprint/
          cp -r brand nexprint/
          
          # Zip the staging folder so the archive contains nexprint/manifest.json
          zip -r nexprint.zip nexprint

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexprint.zip
