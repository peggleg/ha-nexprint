search:
  name: Search Nexprint models
  description: Query Nexprint's model catalog and fire a nexprint_search_results event.
  fields:
    keyword:
      name: Keyword
      description: Search term to look up on Nexprint.
      required: true
      example: "Centauri Carbon"
      selector:
        text:
    page_size:
      name: Page size
      description: Number of models to retrieve.
      default: 30
      selector:
        number:
          min: 1
          max: 100
          mode: box
